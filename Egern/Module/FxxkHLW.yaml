name: 黑料不打烊净化
description: hlwxx_remove_ads
author: 怎么肥事[https://github.com/ZenmoFeiShi]
icon: https://github.com/Toperlock/Quantumult/raw/main/icon/Doraemon/Doraemon-1010.png
dns: {}
url_rewrites:
- match: ^https?:\/\/stats\.kwvprfcr\.xyz
  location: http://reject/
  status_code: 307
- match: ^https?:\/\/mc\.yandex\.ru
  location: http://reject/
  status_code: 307
- match: ^https?:\/\/static\.cloudflareinsights\.com\/beacon
  location: http://reject/
  status_code: 307
map_locals:
- match: ^https?:\/\/api1\.cghhqca\.cc\/api\/eventTracking
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/api\.shuifeng\.cc\/api\/eventTracking
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/ads\.zyudkkup\.com\/api\/eventTracking
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
scriptings:
- http_request:
    name: replaceHeader
    match: ^https?:\/\/(?:www\.)?(?:heiliao|hlwxx|hlcx\d*)\.com\/(?!static\/|favicon|api\/|index\/statistics|uploads\/)
    script_url: https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/scripts/replace-header.js
    env:
      _compat.$argument: (%5Cr%5Cn)Accept-Encoding%3A.%2B(%5Cr%5Cn)-%3E%241Accept-Encoding%3A%20identity%242
    timeout: 30
- http_response:
    name: hlwxx_remove_ads
    match: ^https?:\/\/(?:www\.)?(?:heiliao|hlwxx|hlcx\d*)\.com\/(?!static\/|favicon|api\/|index\/statistics|uploads\/)
    script_url: https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/hlwxx_remove_ads.js
    max_size: -1
    timeout: 60
    body_required: true
mitm:
  hostnames:
    includes:
    - '*heiliao*'
    - '*hlwxx*'
    - '*hlcx*'
    - stats.kwvprfcr.xyz
    - mc.yandex.ru
    - api1.cghhqca.cc
    - api.shuifeng.cc
    - ads.zyudkkup.com
    - static.cloudflareinsights.com
