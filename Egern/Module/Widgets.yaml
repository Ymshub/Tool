# ==========================================
# 📌 模块名称: Egern 桌面小组件合集
# ✨ 主要功能: 提供全套小组件的全局可视化配置入口。完美适配最新版底层 JS 的各项高阶能力，包含黄历定制、时光倒数（防调休）、全国油价定位等。
# 🔗 引用链接: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Widgets.yaml
# ⏱️ 更新时间: 2026.05.19 00:00
# ==========================================

name: "Egern 桌面小组件合集"
description: "包含：岁时黄历、时光倒数、网络信息、全国油价、服务器监控"

auto_update:
  interval: 43200

env_schema:

  # ── [岁时黄历] 配置区 ───────────────────────────────────────────────────
  ASTRO_OR_WEEK:
    name: 🔮 [黄历] 右上角显示模式
    description: "选择黄历面板右上角是显示星座，还是当年/当月周次"
    options: ["星座", "周次"]
    default_value: "星座"

  SHOW_TEACHING_WEEK:
    name: 📚 [黄历] 全局启用教学周
    description: "总开关。开启后，可在星座或周次模式旁展示教学周进度"
    options: ["true", "false"]
    default_value: "true"

  SHOW_TEACHING_WEEK_IN_WEEK:
    name: 🔄 [黄历] 在周次模式下显示教学周
    description: "开启后，即使选择了「周次」，也会在周次文本前强制显示教学周进度"
    options: ["true", "false"]
    default_value: "true"

  TEACHING_WEEK_START:
    name: 🗓️ [黄历] 教学周起始日期
    description: "输入本学期第一周周一的日期，格式 YYYY/MM/DD"
    default_value: "2026/03/02"

  # ── [时光倒数] 节假日控制区 ──────────────────────────────────────────────
  PINNED_HOLIDAY:
    name: ✨ [倒数] 始终置顶节假日
    description: "高亮置顶的节日名称，多个用英文逗号分隔"
    default_value: "高考"

  SHOW_SCHOOL_HOLIDAYS:
    name: 🏫 [倒数] 显示春假和秋假
    description: "是否在倒数面板中显示春假和秋假"
    options: ["true", "false"]
    default_value: "true"

  SPRING_BREAK_DATE:
    name: 🌸 [倒数] 春假手动设置
    description: "格式 MM/DD，留空则不显示该假期"
    default_value: "04/01"

  AUTUMN_BREAK_DATE:
    name: 🍂 [倒数] 秋假手动设置
    description: "格式 MM/DD，留空则不显示该假期"
    default_value: ""

  QINGMING_DATE:
    name: 🌿 [倒数] 清明节调休覆盖
    description: "格式 MM/DD，用于手动修正调休偏差。留空则系统进行高精度天文节气计算"
    default_value: ""

  SHOW_FINANCE_DATES:
    name: 📈 [倒数] 显示金融交割日
    description: "是否显示 A 股期指交割日与期权行权日"
    options: ["true", "false"]
    default_value: "true"

  # ── [时光倒数] 排序与主题区 ──────────────────────────────────────────────
  ENABLE_PRIORITY_SORT:
    name: 🔢 [倒数] 启用优先级排序

  # ── [服务器监控] 节点配置区 ──────────────────────────────────────────────
  SSH_SERVER_1_NAME:
    name: 🏷️ [节点1] 显示名称
    default_value: "Oracle"
  SSH_SERVER_1_HOST:
    name: 🌐 [节点1] IP/域名
    default_value: ""
  SSH_SERVER_1_PORT:
    name: 🔌 [节点1] 端口
    default_value: "22"
  SSH_SERVER_1_USER:
    name: 👤 [节点1] 用户名
    default_value: "root"
  SSH_SERVER_1_PWD:
    name: 🔐 [节点1] 密码
    default_value: ""
  SSH_SERVER_1_KEY:
    name: 🔑 [节点1] 私钥
    default_value: ""

  SSH_SERVER_2_NAME:
    name: 🏷️ [节点2] 显示名称 (留空停用)
    default_value: ""
  SSH_SERVER_2_HOST:
    name: 🌐 [节点2] IP/域名
    default_value: ""
  SSH_SERVER_2_PORT:
    name: 🔌 [节点2] 端口
    default_value: "22"
  SSH_SERVER_2_USER:
    name: 👤 [节点2] 用户名
    default_value: "root"
  SSH_SERVER_2_PWD:
    name: 🔐 [节点2] 密码
    default_value: ""
  SSH_SERVER_2_KEY:
    name: 🔑 [节点2] 私钥
    default_value: ""

  SSH_SERVER_3_NAME:
    name: 🏷️ [节点3] 显示名称 (留空停用)
    default_value: ""
  SSH_SERVER_3_HOST:
    name: 🌐 [节点3] IP/域名
    default_value: ""
  SSH_SERVER_3_PORT:
    name: 🔌 [节点3] 端口
    default_value: "22"
  SSH_SERVER_3_USER:
    name: 👤 [节点3] 用户名
    default_value: "root"
  SSH_SERVER_3_PWD:
    name: 🔐 [节点3] 密码
    default_value: ""
  SSH_SERVER_3_KEY:
    name: 🔑 [节点3] 私钥
    default_value: ""

  SSH_SERVER_4_NAME:
    name: 🏷️ [节点4] 显示名称 (留空停用)
    default_value: ""
  SSH_SERVER_4_HOST:
    name: 🌐 [节点4] IP/域名
    default_value: ""
  SSH_SERVER_4_PORT:
    name: 🔌 [节点4] 端口
    default_value: "22"
  SSH_SERVER_4_USER:
    name: 👤 [节点4] 用户名
    default_value: "root"
  SSH_SERVER_4_PWD:
    name: 🔐 [节点4] 密码
    default_value: ""
  SSH_SERVER_4_KEY:
    name: 🔑 [节点4] 私钥
    default_value: ""

  SSH_SERVER_5_NAME:
    name: 🏷️ [节点5] 显示名称 (留空停用)
    default_value: ""
  SSH_SERVER_5_HOST:
    name: 🌐 [节点5] IP/域名
    default_value: ""
  SSH_SERVER_5_PORT:
    name: 🔌 [节点5] 端口
    default_value: "22"
  SSH_SERVER_5_USER:
    name: 👤 [节点5] 用户名
    default_value: "root"
  SSH_SERVER_5_PWD:
    name: 🔐 [节点5] 密码
    default_value: ""
  SSH_SERVER_5_KEY:
    name: 🔑 [节点5] 私钥
    default_value: ""

scriptings:
  - generic:
      name: 岁时黄历
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Almanac.js
  - generic:
      name: 时光倒数
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Countdown.js
  - generic:
      name: 网络信息
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/NetworkInfo.js
      timeout: 5
  - generic:
      name: 全国油价
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/GasPrice.js
      timeout: 5
  - generic:
      name: 服务器监控
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/ServerMonitor.js
      timeout: 10

widgets:
  - name: 岁时黄历
    script_name: 岁时黄历
  - name: 时光倒数
    script_name: 时光倒数
  - name: 网络信息
    script_name: 网络信息
  - name: 全国油价
    script_name: 全国油价
  - name: 服务器监控
    script_name: 服务器监控
