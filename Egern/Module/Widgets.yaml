# ==========================================
# 📌 模块名称: Egern 桌面小组件合集
# ✨ 主要功能: 提供全套小组件的全局可视化配置入口。完美适配最新版底层 JS 的各项高阶能力，包含黄历定制、时光倒数（防调休）、全国油价定位等。
# 🔗 引用链接: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Widgets.yaml
# ⏱️ 更新时间: 2026.05.19 00:00
# ==========================================

name: "Egern 桌面小组件合集"
description: "包含：岁时黄历、时光倒数、网络信息、全国油价"
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/Other/Fallback.png
auto_update:
  interval: 43200

env_schema:

  # ── [岁时黄历] 配置区 ───────────────────────────────────────────────────
  ASTRO_OR_WEEK:
    name: 🔮 [黄历] 右上角显示模式
    description: "选择黄历面板右上角是显示星座，还是当年/当月周次"
    options: ["星座", "周次"]
    default_value: "周次"

  # ── [时光倒数] 节假日控制区 ──────────────────────────────────────────────
  PINNED_HOLIDAY:
    name: ✨ [倒数] 始终置顶节假日
    description: "高亮置顶的节日名称，多个用英文逗号分隔"
    default_value: "高考"

  # ── [时光倒数] 排序与主题区 ──────────────────────────────────────────────
  ENABLE_PRIORITY_SORT:
    name: 🔢 [倒数] 启用优先级排序
    description: "开启后，重点节日（如春节、国庆等）自动前置显示"
    options: ["true", "false"]
    default_value: "true"

  ENABLE_WEEKEND_THEME:
    name: 🎨 [倒数] 周末蓝调背景
    description: "开启后，周六/周日自动切换为蓝调背景风格"
    options: ["true", "false"]
    default_value: "true"

  SMALL_FORCE_FOUR_ROWS:
    name: 📐 [倒数] 小号补足四行
    description: "开启后，小号尺寸会从各类别补位，尽量保持四行展示"
    options: ["true", "false"]
    default_value: "true"

  # ── [全国油价] 配置区 ────────────────────────────────────────────────────
  GAS_REGION:
    name: 📍 [油价] 查询地区拼音
    description: "直辖市输入拼音，其他省份输入省份/省会拼音"
    default_value: "jiangsu/nanjing"

scriptings:
  - generic:
      name: 岁时黄历
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Almanac.js
  - generic:
      name: 时光倒数
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/Countdown.js
  - generic:
      name: 网络信息
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/NetworkInfo.js
      timeout: 5
  - generic:
      name: 全国油价
      script_url: https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Egern/Widget/GasPrice.js
      timeout: 5

widgets:
  - name: 岁时黄历
    script_name: 岁时黄历
  - name: 时光倒数
    script_name: 时光倒数
  - name: 网络信息
    script_name: 网络信息
  - name: 全国油价
    script_name: 全国油价
