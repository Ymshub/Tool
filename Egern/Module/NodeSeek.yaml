name: NodeSeek 每日签到
description: |-
  登录账号进入设置页面以获取Token，成功后关闭Token脚本。
  可在BoxJs中设置是否启用领取随机鸡腿，默认为固定5个鸡腿。
compat_arguments:
  每日签到Token: 'true'
  每日签到Task: 'true'
  定时参数Cron: 0 0 7 * * *
compat_arguments_desc: |-
  每日签到Token: 获取 NodeSeek 每日签到Token

  每日签到Task：定时运行 NodeSeek 每日签到Task

  定时参数Cron：输入Cron表达式来定时运行 NodeSeek 每日签到Task
author: Sliverkiss[https://github.com/Sliverkiss]
icon: https://lvll.de/Loon/Icon/NodeSeek.png
dns: {}
rules:
- domain_suffix:
    match: nodeseek.com
    policy: Proxy
scriptings:
- http_response:
    name: 每日签到Token
    match: ^https:\/\/www\.nodeseek\.com\/api\/account\/getInfo\/.+\?readme=1&signature=1&phone=1
    script_url: https://gist.githubusercontent.com/Sliverkiss/2b5acc2c4960dd06618c6912302c2c7f/raw/nodeseek.js
    timeout: 60
    body_required: true
- schedule:
    name: 每日签到Task
    cron: 0 0 7 * * *
    script_url: https://gist.githubusercontent.com/Sliverkiss/2b5acc2c4960dd06618c6912302c2c7f/raw/nodeseek.js
    timeout: 60
mitm:
  hostnames:
    includes:
    - www.nodeseek.com
